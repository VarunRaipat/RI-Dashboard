name: RI Daily Report

on:
  schedule:
    # The report must land in the inbox at 20:00 IST (14:30 UTC) sharp.
    # GitHub's cron only starts a scheduled job *near* the requested time, and
    # on this repo it has been starting them 3.5-7.5 HOURS late, not minutes.
    # One trigger can't absorb that: aimed to arrive on time when punctual it
    # lands near midnight IST, and aimed for a 6-hour slip it fires hours early
    # on a day the scheduler behaves.
    #
    # So the triggers are spread across the window jobs actually start in, and
    # send_daily_report.py decides which run is the one that sends: a run more
    # than MAX_WAIT_S before 20:00 IST exits without sending, a run inside that
    # window sleeps out the remainder and sends exactly on time, and a run past
    # 20:00 IST sends immediately so the day is never skipped. The report_log
    # row in Supabase stops the other runs re-sending.
    #
    # Whatever the delay, one of these lands in the send window:
    #   07:00 UTC — covers a ~7h slip
    #   09:00 UTC — covers a ~5.5h slip
    #   11:00 UTC — covers a ~3.5h slip
    #   13:30 UTC — covers the scheduler being punctual again (sleeps 60 min)
    #   14:30 UTC — last backstop; punctual means zero wait
    - cron: "0 7 * * *"
    - cron: "0 9 * * *"
    - cron: "0 11 * * *"
    - cron: "30 13 * * *"
    - cron: "30 14 * * *"
  workflow_dispatch:            # manual trigger from the Actions tab
    inputs:
      force:
        description: "Send now even if it isn't 20:00 IST yet / today's report already went out"
        type: boolean
        default: false

# If the backstop fires while the primary is still sleeping, hand over to the
# newer run rather than have two runners wait in parallel (and if the primary
# ever hangs, this lets the backstop take over instead of queuing behind it).
# The real double-send guard is the report_log marker in Supabase.
concurrency:
  group: ri-daily-report
  cancel-in-progress: true

jobs:
  send-report:
    runs-on: ubuntu-latest
    # A run that lands inside the send window sleeps out the remainder before
    # sending — up to MAX_WAIT_S (65 min) in the script. 80 min leaves headroom
    # for that plus setup, while staying far short of GitHub's 6-hour default,
    # where a genuine stall would surface long after the report was due. Runs
    # that are too early exit in seconds and never reach the sleep.
    timeout-minutes: 80

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests pandas

      - name: Send daily report
        env:
          SUPABASE_URL:       ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:       ${{ secrets.SUPABASE_KEY }}
          GMAIL_USER:         ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REPORT_TO_EMAIL:    ${{ secrets.REPORT_TO_EMAIL }}
          REPORT_FORCE:       ${{ github.event.inputs.force }}
        run: python scripts/send_daily_report.py
